<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Domain Search + TLD Pricing</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">D</span>
        <span>Domain Search</span>
      </div>

      <div class="stats">
        <span id="matchingCount">0</span>
        <span class="slash">/</span>
        <span id="totalCount">0</span>
      </div>
    </header>

    <main class="page">
      <section class="controls panel">
        <div class="field">
          <label for="domainInput">Search domain keyword</label>
          <input
            id="domainInput"
            type="text"
            placeholder="Try: coffee, crypto, design, app"
            autocomplete="off"
            value="coffee"
          />
        </div>

        <div class="field price-field">
          <div class="range-labels">
            <span>Cheapest Registration Price</span>
            <div class="header-values">
              <span>Min: <strong id="minValueLabel">$0.00</strong></span>
              <span>Max: <strong id="maxValueLabel">$500.00</strong></span>
            </div>
          </div>

          <div class="range-row">
            <label class="range-label" for="minPrice">Min</label>
            <input id="minPrice" type="range" min="0" max="500" step="0.01" value="0" />
          </div>

          <div class="range-row">
            <label class="range-label" for="maxPrice">Max</label>
            <input id="maxPrice" type="range" min="0" max="500" step="0.01" value="500" />
          </div>
        </div>

        <label class="toggle-row" for="hideUnavailable">
          <input id="hideUnavailable" type="checkbox" checked />
          <span>Hide unavailable / taken domains</span>
        </label>
      </section>

      <section class="panel tabs-panel">
        <div class="tabs" id="tabs">
          <button class="tab active" data-filter="all">All</button>
          <button class="tab" data-filter="cheapest">Cheapest</button>
          <button class="tab" data-filter="crypto">Crypto</button>
          <button class="tab" data-filter="card">Card Only</button>
        </div>
      </section>

      <section class="table-card panel">
        <div class="table-header">
          <h2>Search Results</h2>
          <span id="statusText">Loading TLD list...</span>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Domain</th>
                <th>TLD</th>
                <th>Cheapest Reg</th>
                <th>Renewal</th>
                <th>Transfer</th>
                <th>Cheapest Registrar</th>
                <th>Payment</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
